[project]
name = "aag-simulator"
version = "0.1.0"
description = "Earned Autonomy Engine — synthetic invoice generator and governed agent simulator"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.scripts]
simulator = "simulator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Invoice dates are business dates with no timezone meaning, so date.today() is
# the correct call. DTZ011 would have us write datetime.now(tz=...).date(), which
# adds timezone ceremony to a value that never carries a time.
ignore = ["DTZ011"]

[tool.ruff.lint.per-file-ignores]
# Typer builds its CLI from function calls in argument defaults (typer.Option,
# typer.Argument). B008 is unavoidable here without fighting the framework.
"simulator/cli.py" = ["B008"]
